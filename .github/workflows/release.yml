name: Release

# Builds standalone desktop bundles of the spektrafilm GUI with PyInstaller.
# Pushing a tag like v0.3.4 also publishes them as a GitHub Release;
# a manual run (workflow_dispatch) only uploads them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-latest
          - name: windows-x86_64
            os: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1

      - name: Install package and PyInstaller
        run: uv pip install . "pyinstaller>=6.11"

      - name: Fix conflicting vendored dylibs
        if: runner.os == 'macOS'
        run: packaging/macos_fix_dylibs.sh

      - name: Build bundle
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build/pyinstaller packaging/spektrafilm.spec

      # Windows runners have no GPU and only OpenGL 1.1; install Mesa's
      # software OpenGL so napari's canvas can render during the smoke test.
      # It is not shipped in the bundle.
      - name: Install software OpenGL
        if: runner.os == 'Windows'
        uses: pyvista/setup-headless-display-action@v3

      - name: Smoke test bundle
        timeout-minutes: 15
        env:
          SPEKTRAFILM_SMOKE_TEST: '1'
          SPEKTRAFILM_SMOKE_LOG: smoke.log
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y xvfb >/dev/null
              app=(xvfb-run -a dist/spektrafilm/spektrafilm) ;;
            macOS)
              app=(dist/spektrafilm.app/Contents/MacOS/spektrafilm) ;;
            Windows)
              app=(dist/spektrafilm/spektrafilm.exe) ;;
          esac
          status=0
          "${app[@]}" || status=$?
          cat smoke.log || echo "no smoke.log written"
          exit $status

      - name: Package bundle
        id: package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          base="spektrafilm-${version}-${{ matrix.name }}"
          case "$RUNNER_OS" in
            Linux)
              file="$base.tar.gz"
              tar -czf "$file" -C dist spektrafilm ;;
            macOS)
              file="$base.dmg"
              hdiutil create -volname spektrafilm -srcfolder dist/spektrafilm.app -ov -format UDZO "$file" ;;
            Windows)
              file="$base.zip"
              (cd dist && 7z a -tzip "../$file" spektrafilm >/dev/null) ;;
          esac
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Build sdist and wheel
        run: uv build --out-dir release

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: release
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "spektrafilm $GITHUB_REF_NAME" \
            --generate-notes
