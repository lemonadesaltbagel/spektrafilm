name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        uses: tlambert03/setup-qt-libs@v1

      - name: Install package
        run: uv pip install -e ".[dev]"

      # The deselected tests already fail on upstream main on every platform
      # (stale test doubles / regression snapshots). Drop each line once the
      # test is fixed upstream or its baseline is regenerated.
      - name: Run tests
        shell: bash
        run: >-
          python -m pytest tests -q -ra
          --deselect "tests/gui/test_layout.py::test_build_controls_panel_places_gamut_compression_sections_on_advanced_tab"
          --deselect "tests/test_lut_mode.py::test_lut_mode_digest_disables_every_dangerous_effect"
          --deselect "tests/test_regression_baselines.py::TestRegressionBaselines::test_pipeline_snapshot[print_rgb_portra_endura_gray_ramp16]"
          --deselect "tests/test_regression_baselines.py::TestRegressionBaselines::test_pipeline_snapshot[print_rgb_fuji_crystal_gray_ramp16]"
          --deselect "tests/test_regression_baselines.py::TestRegressionBaselines::test_pipeline_snapshot[print_rgb_portra_endura_green_patch8]"

  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Build
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
